[project]
name = "mindctl-laya"
version = "0.1.0"
description = "Pinned Laya typed-decision sidecar for Mindctl"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "huggingface-hub>=0.27,<2",
  "laya",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=9,<10",
  "pytest-anyio>=0.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mindctl_laya"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
