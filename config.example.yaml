# Environment-variable names are configuration; do not put secret values here.
debug: false
listen: ":8080"

client_auth:
  token_env: MINDCTL_GATEWAY_TOKEN
  header: X-Mindctl-Token
  max_body_bytes: 16777216

# Opt in to Claude Code's Anthropic Messages endpoint with a separate client
# authentication header and the Anthropic OAuth provider configured below.
# claude_messages:
#   enabled: true

# Optional local Headroom compression. Failures are returned before any
# provider request; disable this option and restart to recover from an outage.
headroom:
  enabled: false
  mode: cache

classifier:
  # Points to either the optional local Laya sidecar or an operator-managed
  # compatible endpoint. The sidecar pins convaiinnovations/laya internally.
  endpoint: http://laya:8091
  token_env: LAYA_CLASSIFIER_TOKEN
  timeout: 0s
  max_retries: 3

sqlite:
  path: mindctl.db
  # A finite duration enables app-owned deletion of encrypted content only.
  # Set this to 0s for unlimited retention, which starts no maintenance task.
  retention: 720h
  # Used only for finite retention; 0s uses the bounded one-minute default.
  retention_maintenance_interval: 15m

encryption:
  active_key_id: primary
  keys:
    primary: MINDCTL_ENCRYPTION_KEY

routing:
  min_tier: T0
  max_tier: T6
  safe_fallback_tier: T4
  # All cost values are USD. Zero disables an optional budget or penalty.
  failure_escalation_cost_usd: 0
  latency_penalty_usd_per_second: 0
  min_success_probability: 0
  max_direct_cost_usd: 0
  max_expected_cost_usd: 0
  max_latency: 0s
  # Zero retains the policy's safe 0.7 confidence default.
  min_classifier_confidence: 0
  reasoning_floors: []
  coding_floors: []
  risk_floors: []
  underspecification_floors: []

providers:
  # Supported provider IDs are openai, anthropic, gemini, deepseek, and meta. Authentication
  # modes are exclusive. ChatGPT OAuth passthrough needs no OPENAI_API_KEY;
  # Codex supplies its caller-managed credential on each request.
  - id: openai
    base_url: https://chatgpt.com/backend-api/codex
    auth: chatgpt_oauth_passthrough
  # API-key alternative (auth defaults to api_key when omitted):
  # - id: openai
  #   base_url: https://api.openai.com
  #   auth: api_key
  #   api_key_env: OPENAI_API_KEY
  # For Codex using /v1/responses, supply this header from CLAUDE_CODE_OAUTH_TOKEN;
  # Claude Code using /v1/messages supplies its native bearer credential instead:
  # env_http_headers = { "X-Mindctl-Claude-Token" = "CLAUDE_CODE_OAUTH_TOKEN" }
  - id: anthropic
    base_url: https://api.anthropic.com
    auth: claude_oauth_passthrough
  # DeepSeek's OpenAI-compatible API. V4 Flash and Pro provide both Thinking
  # and Non-Thinking modes; set DEEPSEEK_API_TOKEN before starting Mindctl.
  - id: deepseek
    base_url: https://api.deepseek.com
    auth: api_key
    api_key_env: DEEPSEEK_API_TOKEN
  # Meta Model API exposes an OpenAI-compatible Responses API.
  - id: meta
    base_url: https://api.meta.ai/v1
    auth: api_key
    api_key_env: MUSE_API_KEY

models:
  # ChatGPT Pro default catalog. GPT-6 availability may still be rolling out
  # for an individual ChatGPT account. The portable capabilities below cover
  # documented Responses support Mindctl can forward: image input, custom
  # tools, structured output, and web search (not hosted shell or computer
  # use, which Mindctl does not yet encode). Prices are USD per million tokens
  # for comparable API usage; ChatGPT subscription usage follows its own limits.
  - id: gpt-6-astra
    provider: openai
    tier: T6
    capabilities: [chat, tools, images, json_schema, web_search]
    context_window: 128000
    # Positive output reservations require this configured capacity.
    max_output_tokens: 16384
    available: true
    # input_price and output_price are USD per million tokens.
    input_price: 10
    cached_input_price_usd_per_million: 1
    output_price: 50
    per_request_price_usd: 0
    # Zero means no P95 latency prior is configured.
    latency_p95: 0s
    success_prior: 1
    task_success_priors: {}

  - id: gpt-6-sol
