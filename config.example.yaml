# Environment-variable names are configuration; do not put secret values here.
listen: ":8080"

client_auth:
  token_env: MINDCTL_GATEWAY_TOKEN
  header: X-Mindctl-Token
  max_body_bytes: 16777216

classifier:
  # Points to either the optional local Laya sidecar or an operator-managed
  # compatible endpoint. The sidecar pins convaiinnovations/laya internally.
  endpoint: http://laya:8091
  token_env: LAYA_CLASSIFIER_TOKEN
  timeout: 0s
  max_retries: 3

sqlite:
  path: mindctl.db
  # A finite duration enables app-owned deletion of encrypted content only.
  # Set this to 0s for unlimited retention, which starts no maintenance task.
  retention: 720h
  # Used only for finite retention; 0s uses the bounded one-minute default.
  retention_maintenance_interval: 15m

encryption:
  active_key_id: primary
  keys:
    primary: MINDCTL_ENCRYPTION_KEY

routing:
  min_tier: T0
  max_tier: T6
  safe_fallback_tier: T4
  # All cost values are USD. Zero disables an optional budget or penalty.
  failure_escalation_cost_usd: 0
  latency_penalty_usd_per_second: 0
  min_success_probability: 0
  max_direct_cost_usd: 0
  max_expected_cost_usd: 0
  max_latency: 0s
  # Zero retains the policy's safe 0.7 confidence default.
  min_classifier_confidence: 0
  reasoning_floors: []
  coding_floors: []
  risk_floors: []
  underspecification_floors: []

providers:
  # Supported provider IDs are openai, anthropic, and gemini. Authentication
  # modes are exclusive. ChatGPT OAuth passthrough needs no OPENAI_API_KEY;
  # Codex supplies its caller-managed credential on each request.
  - id: openai
    base_url: https://chatgpt.com/backend-api/codex
    auth: chatgpt_oauth_passthrough
  # API-key alternative (auth defaults to api_key when omitted):
  # - id: openai
  #   base_url: https://api.openai.com
  #   auth: api_key
  #   api_key_env: OPENAI_API_KEY

models:
  - id: gpt-5
    provider: openai
    tier: T4
    capabilities: [chat, tools]
    context_window: 128000
    # Positive output reservations require this configured capacity.
    max_output_tokens: 16384
    available: true
    # input_price and output_price are USD per million tokens.
    input_price: 0
    cached_input_price_usd_per_million: 0
    output_price: 0
    per_request_price_usd: 0
    # Zero means no P95 latency prior is configured.
    latency_p95: 0s
    success_prior: 1
    task_success_priors: {}
